- type: entity
  parent: EWMedievalBaseWeapon
  id: EWMedievalMilitaryFlail
  categories: [ ForkFiltered ]
  name: "military flail"
  description: "A threshing flail turned weapon: a hafted bar with a studded iron striker on a chain."
  components:
  - type: Sprite
    sprite: _Emberwake/Medieval/Weapons/military_flail.rsi
    state: icon
  - type: MedievalWeaponVisuals
  - type: Item
    size: Normal
    sprite: _Emberwake/Medieval/Weapons/military_flail_held.rsi
  - type: Clothing
    sprite: _Emberwake/Medieval/Weapons/military_flail_held.rsi
    quickEquip: false
    slots:
    - Belt
  - type: MeleeWeapon
    attackRate: 0.85
    damage:
      types:
        Blunt: 29
    soundHit:
      path: /Audio/Weapons/genhit3.ogg
  - type: StaticPrice
    price: 60

