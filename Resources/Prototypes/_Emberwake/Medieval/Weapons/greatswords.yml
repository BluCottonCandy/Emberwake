- type: entity
  parent: EWMedievalBaseTwoHanded
  id: EWMedievalSwordOfState
  categories: [ ForkFiltered ]
  name: "sword of state"
  description: "A gilded ceremonial greatsword. Use it in hand to light the oil-soaked blade; wield it while lit to set it fully ablaze. While lit, a heavy swing sets everyone it hits on fire, twice as fiercely when it blazes in both hands."
  components:
  - type: Sprite
    sprite: _Emberwake/Medieval/Weapons/sword_of_state.rsi
    scale: 0.65, 0.65
    layers:
    - state: icon
      map: [ base ]
  - type: MedievalWeaponVisuals
  - type: Item
    size: Large
    sprite: _Emberwake/Medieval/Weapons/sword_of_state_held.rsi
  - type: Clothing
    sprite: _Emberwake/Medieval/Weapons/sword_of_state_held.rsi
    quickEquip: false
    slots:
    - Back
  - type: MeleeWeapon
    attackRate: 0.8
    range: 1.75
    damage:
      types:
        Slash: 15
        Blunt: 4
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Sharp
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 40
        Piercing: 9
  - type: ItemToggle
    toggleOnWield: false
    soundActivate:
      path: /Audio/Items/Lighters/lighter1.ogg
    soundDeactivate:
      path: /Audio/Items/Lighters/lighter_off.ogg
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Slash: 15
        Blunt: 4
        Heat: 11
  - type: ComponentToggler
    components:
    - type: IgniteOnMeleeHit
      fireStacks: 1
  - type: ItemTogglePointLight
  - type: PointLight
    enabled: false
    radius: 2.5
    energy: 2
    color: "#ff9a3c"
  - type: MedievalLook
    onState: lit
    wieldedOnState: blaze
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MedievalLookVisuals.State:
        base:
          icon: { state: icon }
          lit: { state: lit }
          blaze: { state: blaze }
  - type: MedievalHeavyAttack
    igniteStacks: 2
    wieldedIgniteStacks: 4
  - type: StaticPrice
    price: 200
