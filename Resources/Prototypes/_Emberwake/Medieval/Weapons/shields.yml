- type: entity
  parent: EWMedievalBaseShield
  id: EWMedievalIronRoundShield
  categories: [ ForkFiltered ]
  name: "iron round shield"
  description: "A round wooden shield faced with an iron boss and rim, the kind steppe riders carried."
  components:
  - type: Sprite
    sprite: _Emberwake/Medieval/Weapons/iron_round_shield.rsi
    state: icon
  - type: MedievalWeaponVisuals
  - type: Item
    size: Huge
    sprite: _Emberwake/Medieval/Weapons/iron_round_shield_held.rsi
  - type: Clothing
    sprite: _Emberwake/Medieval/Weapons/iron_round_shield_held.rsi
    quickEquip: false
    slots:
    - Back
  - type: MeleeWeapon
    attackRate: 0.9
    damage:
      types:
        Blunt: 9
    soundHit:
      path: /Audio/Weapons/genhit3.ogg
  - type: Blocking
    passiveBlockModifier:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
    activeBlockModifier:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.80
      flatReductions:
        Blunt: 2
        Slash: 2
        Piercing: 2
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
  - type: StaticPrice
    price: 60

