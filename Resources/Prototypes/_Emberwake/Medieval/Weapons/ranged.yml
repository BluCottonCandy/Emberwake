- type: entity
  parent: CP14BaseBow
  id: EWMedievalLongbow
  categories: [ ForkFiltered ]
  name: "longbow"
  description: "A tall yew longbow. It takes a strong back to draw, and it hits hard at range."
  components:
  - type: Sprite
    sprite: _Emberwake/Medieval/Weapons/longbow.rsi
    scale: 0.6, 0.6
    state: icon
  - type: MedievalWeaponVisuals
    scale: 1
  - type: Item
    size: Large
    sprite: _Emberwake/Medieval/Weapons/longbow_held.rsi
  - type: Clothing
    sprite: _Emberwake/Medieval/Weapons/longbow_held.rsi
    quickEquip: false
    slots:
    - Back
  - type: MeleeWeapon
    attackRate: 1.0
    damage:
      types:
        Blunt: 6
    soundHit:
      path: /Audio/Weapons/genhit3.ogg
