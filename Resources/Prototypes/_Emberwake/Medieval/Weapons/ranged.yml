- type: entity
  parent: EWMedievalBaseWeapon
  id: EWMedievalCrossbow
  categories: [ ForkFiltered ]
  name: "crossbow"
  description: "A heavy crossbow with a spanning stirrup. Crank the string back first: use it in hand, or set it on the ground and crank it there (E, or right-click > Crank). Then load an arrow. Slow, but it hits much harder than a bow. Fire it one-handed, or wield it for a steadier aim."
  components:
  - type: Sprite
    sprite: _Emberwake/Medieval/Weapons/crossbow.rsi
    layers:
    - state: icon
      map: [ base ]
  - type: MedievalWeaponVisuals
  - type: Item
    size: Large
    sprite: _Emberwake/Medieval/Weapons/crossbow_held.rsi
  - type: Clothing
    sprite: _Emberwake/Medieval/Weapons/crossbow_held.rsi
    quickEquip: false
    slots:
    - Back
  - type: MeleeWeapon
    attackRate: 1.0
    damage:
      types:
        Blunt: 8
    soundHit:
      path: /Audio/Weapons/genhit3.ogg
  - type: Gun
    fireRate: 1
    projectileSpeed: 50
    minAngle: 0
    maxAngle: 10
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: BulletMiss
  - type: Crossbow
    spanTime: 2.5
    bonusDamage:
      types:
        Piercing: 25
  - type: Wieldable
  - type: SpeedModifiedOnWield
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: GunWieldBonus
    minAngle: 0
    maxAngle: -7
  - type: ItemSlots
    slots:
      projectiles:
        name: Arrow
        insertSound: /Audio/Weapons/Guns/Misc/arrow_nock.ogg
        whitelist:
          tags:
          - CP14CrossbowBolt
          - CP14BigCrossbowBolt
          - CP14Arrow
  - type: ContainerContainer
    containers:
      projectiles: !type:ContainerSlot
  - type: ContainerAmmoProvider
    container: projectiles
  - type: MedievalLoadedLook
    container: projectiles
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MedievalLookVisuals.State:
        base:
          icon: { state: icon }
          loaded: { state: loaded }
  - type: StaticPrice
    price: 100

- type: entity
  parent: EWMedievalBaseWeapon
  id: EWMedievalSling
  categories: [ ForkFiltered ]
  name: "shepherd's sling"
  description: "A leather pouch on two cords. Pack it with a handful of stones, bricks, bottles or grenades, whirl it, and let fly: everything in the pouch goes in one shot. Grenades arm as they leave; bullets just get thrown like stones (the fustibalus fires them)."
  components:
  - type: Sprite
    sprite: _Emberwake/Medieval/Weapons/sling.rsi
    layers:
    - state: icon
      map: [ base ]
  - type: MedievalWeaponVisuals
