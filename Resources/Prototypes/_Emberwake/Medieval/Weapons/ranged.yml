    sprite: _Emberwake/Medieval/Weapons/sling_held.rsi
    quickEquip: false
    slots:
    - Belt
  - type: MeleeWeapon
    attackRate: 1.0
    damage:
      types:
        Blunt: 1
    soundHit:
      path: /Audio/Weapons/genhit3.ogg
  - type: Gun
    fireRate: 0.8
    projectileSpeed: 14
    minAngle: 0
    maxAngle: 6
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/bolathrow.ogg
    soundEmpty: null
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,3,1
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: ContainerAmmoProvider
    container: storagebase
  - type: Sling
    maxSize: Normal
    bonusDamage:
      types:
        Blunt: 12
  - type: MedievalLoadedLook
    container: storagebase
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MedievalLookVisuals.State:
        base:
          icon: { state: icon }
          loaded: { state: loaded }
  - type: StaticPrice
    price: 15

