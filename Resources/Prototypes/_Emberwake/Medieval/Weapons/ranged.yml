    fireRate: 0.7
    projectileSpeed: 45
    minAngle: 0
    maxAngle: 4
  - type: Wieldable
  - type: SpeedModifiedOnWield
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: StaticPrice
    price: 100

