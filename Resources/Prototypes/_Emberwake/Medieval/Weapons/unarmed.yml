- type: entity
  parent: ClothingHandsBase
  id: EWMedievalKnuckledusters
  categories: [ ForkFiltered ]
  name: "steel knuckledusters"
  description: "A steel grip that turns a punch into a bone-breaker. Worn on the hands."
  components:
  - type: Sprite
    sprite: _Emberwake/Medieval/Weapons/knuckledusters.rsi
    state: icon
  - type: MedievalWeaponVisuals
    scale: 1
  - type: Item
    size: Small
    sprite: _Emberwake/Medieval/Weapons/knuckledusters_held.rsi
  - type: Clothing
    sprite: _Emberwake/Medieval/Weapons/knuckledusters_held.rsi
    slots: [gloves]
  - type: MeleeWeapon
    soundHit:
      collection: MetalThud
    range: 1.3
    attackRate: 1.1
    damage:
      types:
        Blunt: 20
    animation: WeaponArcFist
    wideAnimation: WeaponArcFist
    mustBeEquippedToUse: true
  - type: StaminaDamageOnHit
    damage: 8
  - type: StaticPrice
    price: 100

