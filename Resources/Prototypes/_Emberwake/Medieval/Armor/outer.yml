- type: entity
  parent: CP14ClothingOuterClothingBase
  id: EWClothingOuterMedievalJackOfPlatesCrimson
  categories: [ ForkFiltered ]
  name: crimson jack of plates
  description: A leather coat with small steel plates riveted inside, trimmed in crimson. Light enough to run in.
  components:
  - type: Sprite
    sprite: _Emberwake/Medieval/Armor/OuterClothing/jack_of_plates_crimson.rsi
  - type: Clothing
    sprite: _Emberwake/Medieval/Armor/OuterClothing/jack_of_plates_crimson.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.75
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.6
  - type: ClothingSpeedModifier
    walkModifier: 1.05
    sprintModifier: 1.05

