- type: entity
  parent: CP14ClothingOuterClothingBase
  id: EWClothingOuterWayfarerJack
  name: wayfarer's leather jack
  description: A boiled-leather breastplate with a chevron pressed into the hide. A cross-body strap holds a fur-lined guard over the left shoulder, and split panels hang from the belt to protect the thighs.
  components:
  - type: Sprite
    sprite: _Emberwake/Clothing/wayfarer_jack.rsi
  - type: Clothing
    sprite: _Emberwake/Clothing/wayfarer_jack.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.90
        Slash: 0.85
        Piercing: 0.95
  - type: PhysicalComposition
    materialComposition:
      CP14Leather: 72
      CP14Cloth: 20
      CP14Iron: 2
  - type: StaticPrice
    price: 120

