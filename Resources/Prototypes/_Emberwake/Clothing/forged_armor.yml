- type: entity
  parent: CP14ClothingOuterClothingChainmail
  id: EWClothingOuterRingwatchHauberk
  name: Ringwatch iron hauberk
  description: Riveted iron rings hang in alternating rows from the shoulders to a split hem. A leather belt gathers the mail over a cloth lining.
  components:
  - type: Sprite
    sprite: _Emberwake/Clothing/ringwatch_hauberk.rsi
  - type: Clothing
    sprite: _Emberwake/Clothing/ringwatch_hauberk.rsi
  - type: PhysicalComposition
    materialComposition:
      CP14Iron: 60
      CP14Cloth: 20
      CP14Leather: 12
  - type: StaticPrice
    price: 170

